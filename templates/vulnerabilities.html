<!DOCTYPE html>
<html>
<head>
    <title>Vulnerability Inventory</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1>Vulnerability Inventory</h1>

<table>
    <tr>
        <th>CVE ID</th>
        <th>Severity</th>
        <th>CVSS</th>
        <th>Devices Affected</th>
    </tr>
    {% for v in vulnerabilities %}
    <tr>
        <td>{{ v.cve_id }}</td>
        <td>{{ v.severity }}</td>
        <td>{{ v.cvss }}</td>
        <td>{{ v.device_count }}</td>
    </tr>
    {% else %}
    <tr>
        <td colspan="4">No vulnerabilities found. Please ingest data first.</td>
    </tr>
    {% endfor %}
</table>

<a href="/dashboard">Back to Dashboard</a>
</body>
</html>
