<!DOCTYPE html>
<html>
<head>
    <title>Device Inventory</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1>Device Inventory</h1>

<table>
    <tr>
        <th>Device ID</th>
        <th>Hostname</th>
        <th>OS</th>
        <th>Criticality</th>
    </tr>
    {% for d in devices %}
    <tr>
        <td>{{ d.device_id }}</td>
        <td>{{ d.hostname }}</td>
        <td>{{ d.os }}</td>
        <td>{{ d.criticality }}</td>
    </tr>
    {% else %}
    <tr>
        <td colspan="4">No devices found. Please ingest data first.</td>
    </tr>
    {% endfor %}
</table>

<a href="/dashboard">Back to Dashboard</a>
</body>
</html>
