<!DOCTYPE html>
<html>
<head>
    <title>Patch Inventory</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1>Patch Inventory</h1>

<table>
    <tr>
        <th>Patch ID</th>
        <th>Title</th>
        <th>Severity</th>
        <th>Reboot Required</th>
    </tr>
    {% for p in patches %}
    <tr>
        <td>
            {% if p.patch_id %}
            <a href="https://support.microsoft.com/search?query={{ p.patch_id }}" target="_blank" rel="noopener noreferrer">{{ p.patch_id }}</a>
            {% else %}
            {{ p.patch_id }}
            {% endif %}
        </td>
        <td>{{ p.title }}</td>
        <td>{{ p.severity }}</td>
        <td>{{ p.reboot_required }}</td>
    </tr>
    {% else %}
    <tr>
        <td colspan="4">No patches found. Please ingest data first.</td>
    </tr>
    {% endfor %}
</table>

<a href="/dashboard">Back to Dashboard</a>
</body>
</html>
